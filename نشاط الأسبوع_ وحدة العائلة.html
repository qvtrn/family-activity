<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نشاط الأسبوع: وحدة العائلة</title>
<style>
:root{--bg:#eef6fb;--card:#fff;--ink:#2b3a48;--acc:#5b9bd5;--ok:#7bc47f;--roof:#d98c7a;--wall:#f6e7c8;--sel:#ffe08a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e2a35;--card:#2c3b49;--ink:#eaf1f7;--acc:#6aa8dd;--ok:#6fb774;--roof:#b97363;--wall:#5a5140;--sel:#8a7430;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:24px;text-align:center;margin:6px 0 14px}
.menu button,.btn{display:block;width:100%;margin:10px 0;padding:18px;font-size:20px;border:0;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 2px 6px #0002;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.top .btn{width:auto;margin:0;padding:10px 16px;font-size:16px}
.msg{text-align:center;font-size:19px;min-height:30px;margin:6px 0}
.house{position:relative;margin:6px auto;width:min(100%,360px)}
.roof{width:0;height:0;margin:0 auto;border-left:190px solid transparent;border-right:190px solid transparent;border-bottom:90px solid var(--roof);max-width:100%}
.body{background:var(--wall);border-radius:0 0 14px 14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{height:90px;border:3px dashed #9aa;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:52px;background:#fff6;cursor:pointer}
.slot.full{border-style:solid;border-color:var(--ok);background:#fff9}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.m{width:80px;height:92px;border:3px solid transparent;border-radius:16px;background:var(--card);font-size:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 5px #0002;color:var(--ink)}
.m small{font-size:15px}
.m.sel{background:var(--sel);border-color:var(--acc)}
.m.done{opacity:.25;pointer-events:none}
.m.good{background:var(--ok);pointer-events:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.col .m{width:100%;height:104px;font-size:56px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.15)}}
.goal{display:flex;justify-content:center;align-items:center;gap:12px;font-size:20px}
.goal .m{width:96px;height:104px;font-size:56px;cursor:default;border-color:var(--acc)}
.field{position:relative;height:340px;margin-top:10px;background:var(--card);border-radius:18px;overflow:hidden}
.fall{position:absolute;width:25%;top:0;display:flex;justify-content:center;font-size:56px;background:none;border:0;cursor:pointer;padding:6px}
.stars{font-size:26px;text-align:center;letter-spacing:4px}
.win{text-align:center;font-size:28px;padding:20px 0}
.win .big{font-size:80px}
.logo{background:#fff;border-radius:18px;padding:10px 16px;margin:4px auto 10px;width:min(70%,240px);text-align:center;box-shadow:0 2px 6px #0002}
.logo img{width:100%;height:auto;display:block}
.ph{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block}
.av{width:56px;height:62px;display:block}
.col .m .ph{width:84px;height:84px}
.col .m .av{width:84px;height:92px}
.slot .ph,.fall .ph{width:72px;height:72px}
.slot .av,.fall .av{width:76px;height:84px}
.goal .m .ph{width:80%;height:80%}
.goal .m .av{width:80%;height:80%}
</style>
</head>
